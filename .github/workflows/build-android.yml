name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Remove duplicate Android resources
        shell: bash
        run: |
          set -e

          RES_DIR="androidApp/src/main/res"

          if [ -d "$RES_DIR" ]; then
            find "$RES_DIR" -type f -name "*.webp" | while read -r webp; do
              png="${webp%.webp}.png"

              if [ -f "$png" ]; then
                echo "Removing duplicate: $webp"
                rm -f "$webp"
              fi
            done
          fi

          echo "Resource cleanup completed."

      - name: Verify core submodule
        run: |
          echo "Checking core directory..."
          if [ ! -d "core" ]; then
            echo "ERROR: core directory does not exist."
            exit 1
          fi

          echo "Core directory exists."
          ls -la core | head -30

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-GPT-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
